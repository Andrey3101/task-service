events {
    worker_connections 1024;
}

http {
    upstream task_backend {
        least_conn;
        server task-service-1:8080;
        server task-service-2:8080;
    }
    server {
        listen 80;
        location / {
            proxy_pass http://task_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}