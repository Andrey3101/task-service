version: '3.8'

services:
  task-service:
    build: .
    ports:
      - "8009:8009"
    environment:
      - SERVER_PORT=8009
      - SERVER_HOST=0.0.0.0
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=task_service
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - AUTH_SERVICE_URL=http://auth-service:8000
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - JWT_ENCRYPTION_KEY=your-encryption-key-32-chars
      - LOG_LEVEL=info
      - LANGUAGE=en
      - NOTIFICATION_SERVICE_URL=http://notification-service:8000
      - NOTIFICATION_SERVICE_API_KEY=default-api-key
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - helper-network

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=task_service
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - helper-network

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    networks:
      - helper-network

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - helper-network

volumes:
  postgres_data:

networks:
  helper-network:
    driver: bridge