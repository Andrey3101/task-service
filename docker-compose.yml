version: '3.8'

services:
  task-service:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DBConn: postgres://user:password@postgres:5432/tasks?sslmode=disable
      RedisAddr: redis:6379
      RabbitMQ: amqp://guest:guest@rabbitmq:5672/
      GOOGLE_CLIENT_ID: your-google-client-id
      GOOGLE_CLIENT_SECRET: your-google-client-secret
      GOOGLE_REDIRECT_URI: http://localhost:8082/google/callback
      JWTSecret: your-secret-key
      Port: 8082
    ports:
      - "8082:8082"
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - app-network

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tasks
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  redis:
    image: redis:6
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: