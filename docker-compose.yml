version: '3.8'

services:
  task-service:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_CONN: postgresql://postgres:mysecretpassword@host.docker.internal:5432/postgres
      RedisAddr: redis:6379
      RabbitMQ: amqp://guest:guest@rabbitmq:5672/
      GOOGLE_CLIENT_ID: your-google-client-id
      GOOGLE_CLIENT_SECRET: your-google-client-secret
      GOOGLE_REDIRECT_URI: http://localhost:8082/google/callback
      JWTSecret: your-secret-key
      Port: 8082
    ports:
      - "8082:8082"
    depends_on:
      - redis
      - rabbitmq
    networks:
      - app-network


  redis:
    image: redis:6
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"  # Основной порт RabbitMQ
      - "15672:15672" # Порт веб-интерфейса управления
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: