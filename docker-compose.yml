version: "3.8"
services:
  task-service-1:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_CONN=postgres://user:password@db:5432/tasks_db
      - REDIS_ADDR=redis:6379
      - RABBITMQ=amqp://guest:guest@rabbitmq:5672/
      - JWT_SECRET=your_secret_key
    depends_on:
      - db
      - redis
      - rabbitmq
  task-service-2:
    build: .
    ports:
      - "8081:8080"
    environment:
      - DB_CONN=postgres://user:password@db:5432/tasks_db
      - REDIS_ADDR=redis:6379
      - RABBITMQ=amqp://guest:guest@rabbitmq:5672/
      - JWT_SECRET=your_secret_key
    depends_on:
      - db
      - redis
      - rabbitmq
  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=tasks_db
    volumes:
      - task_db_data:/var/lib/postgresql/data
  redis:
    image: redis:6
  rabbitmq:
    image: rabbitmq:3-management
volumes:
  task_db_data: